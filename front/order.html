<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | PetalSpeak</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">PETALSPEAK</div>

        <nav class="nav">
            <a href="/" class="back-btn" data-i18n="back_home">Back</a>
            <a href="/cart.html" class="cart-link">
                🛒 <span id="cartCount">0</span>
            </a>

            <div class="lang-switch">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="et">ET</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="section">
            <div class="panel order-panel">
                <h2 class="center" data-i18n="order_title">Order Your Bouquet</h2>
                <p class="order-subtitle center" data-i18n="order_subtitle">
                    Fill in the form and we will prepare your bouquet with care.
                </p>

                <div class="order-layout">
                    <div class="order-preview-card">
                        <img id="preview" class="order-preview-img" src="" alt="Bouquet preview">
                        <h3 id="title" class="order-preview-title"></h3>
                        <p id="price" class="order-price"></p>
                    </div>

                    <div class="order-form">
                        <label class="order-label" for="name" data-i18n="name_label">Your name</label>
                        <input id="name" class="order-input" type="text" placeholder="Your name">

                        <label class="order-label" for="email" data-i18n="email_label">Email</label>
                        <input id="email" class="order-input" type="email" placeholder="Email">

                        <label class="order-label" for="message" data-i18n="message_label">Message</label>
                        <textarea id="message" class="order-textarea" placeholder="Message for recipient"></textarea>

                        <label class="order-label" for="address" data-i18n="address_label">Delivery address</label>
                        <input
                            id="address"
                            class="order-input"
                            type="text"
                            placeholder="Delivery address"
                        >

                        <h3 class="payment-title" data-i18n="payment_title">Payment details</h3>

                        <label class="order-label" for="cardName" data-i18n="card_name_label">Cardholder name</label>
                        <input id="cardName" class="order-input" type="text" placeholder="Name on card">

                        <label class="order-label" for="cardNumber" data-i18n="card_number_label">Card number</label>
                        <input id="cardNumber" class="order-input" type="text" maxlength="19" placeholder="1234 5678 9012 3456">

                        <div class="card-row">
                            <div>
                                <label class="order-label" for="expiry" data-i18n="expiry_label">Expiry date</label>
                                <input id="expiry" class="order-input" type="text" maxlength="5" placeholder="MM/YY">
                            </div>

                            <div>
                                <label class="order-label" for="cvv" data-i18n="cvv_label">CVV</label>
                                <input id="cvv" class="order-input" type="text" maxlength="3" placeholder="123">
                            </div>
                        </div>

                        <button id="orderBtn" class="btn order-submit" data-i18n="pay_now_btn" type="button">
                            Pay now
                        </button>

                        <p id="result" class="order-result"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let translations = {};

        function getCart() {
            try {
                const checkoutCart = JSON.parse(localStorage.getItem("checkoutCart")) || [];

                if (checkoutCart.length) {
                    return checkoutCart;
                }

                const selectedBouquet = JSON.parse(localStorage.getItem("selectedBouquet"));

                if (selectedBouquet) {
                    return [{
                        ...selectedBouquet,
                        quantity: 1
                    }];
                }

                return [];
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        function getToken() {
            return localStorage.getItem("token");
        }

        async function loadLanguage(lang) {
            const response = await fetch(`/locales/${lang}.json`);
            translations = await response.json();
            applyTranslations();
            setActiveButton(lang);
            loadOrderPreview();
        }

        function applyTranslations() {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[key]) el.innerHTML = translations[key];
            });

            document.getElementById("name").placeholder =
                translations["name_placeholder"] || "Your name";
            document.getElementById("email").placeholder =
                translations["email_placeholder"] || "Email";
            document.getElementById("message").placeholder =
                translations["message_placeholder"] || "Message for recipient";
            document.getElementById("address").placeholder =
                translations["address_placeholder"] || "Delivery address";
        }

        function setActiveButton(lang) {
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.remove("active");
            });

            const activeBtn = document.querySelector(`[data-lang="${lang}"]`);
            if (activeBtn) activeBtn.classList.add("active");
        }

        async function loadCurrentUser() {
            const token = getToken();
            if (!token) return null;

            try {
                const res = await fetch("/api/auth/me", {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (!res.ok) return null;
                return await res.json();
            } catch {
                return null;
            }
        }

        async function autofillUserData() {
            const user = await loadCurrentUser();
            if (!user) return;

            const nameInput = document.getElementById("name");
            const emailInput = document.getElementById("email");

            if (nameInput && !nameInput.value.trim()) {
                nameInput.value = user.name || "";
            }

            if (emailInput && !emailInput.value.trim()) {
                emailInput.value = user.email || "";
            }
        }

        function loadOrderPreview() {
            const cart = getCart();

            const previewCard = document.querySelector(".order-preview-card");

            if (!previewCard) return;

            if (!cart.length) {
                previewCard.innerHTML = `<p>Cart is empty</p>`;
                return;
            }

            const total = cart.reduce((sum, item) => {
                return sum + (Number(item.price) || 0) * (Number(item.quantity) || 1);
            }, 0);

            previewCard.innerHTML = `
                <h3 class="order-preview-title">Your cart</h3>

                ${cart.map(item => `
                    <div style="margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid #ddd;">
                        <img class="order-preview-img" src="${item.img || ""}" alt="${item.title || ""}">
                        <h3 class="order-preview-title">${item.title || "Bouquet"}</h3>
                        <p class="order-price">
                            €${Number(item.price || 0).toFixed(2)} × ${item.quantity || 1}
                        </p>
                    </div>
                `).join("")}

                <h3 class="order-preview-title">
                    Total: €${total.toFixed(2)}
                </h3>
            `;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        async function sendOrder() {
            const cart = getCart();
            const resultEl = document.getElementById("result");
            const orderBtn = document.getElementById("orderBtn");

            if (!cart.length) {
                resultEl.textContent = "Cart is empty";
                return;
            }

            const customerName = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();
            const address = document.getElementById("address").value.trim();

            if (!customerName || !email || !address) {
                resultEl.textContent =
                    translations["fill_required_fields"] ||
                    "Please fill in all required fields";
                return;
            }

            if (!isValidEmail(email)) {
                resultEl.textContent = "Invalid email";
                return;
            }

            const headers = {
                "Content-Type": "application/json"
            };

            const token = getToken();
            if (token) {
                headers.Authorization = `Bearer ${token}`;
            }

            orderBtn.disabled = true;

            try {
                const res = await fetch("/api/orders", {
                    method: "POST",
                    headers,
                    body: JSON.stringify({
                        customerName,
                        email,
                        message,
                        address,
                        items: cart
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Order failed");
                }

                const total = cart.reduce((sum, item) => {
                    return sum + (Number(item.price) || 0) * (Number(item.quantity) || 1);
                }, 0);

                localStorage.setItem("lastOrderedBouquet", JSON.stringify({
                    titleText:
                        cart.length === 1
                            ? cart[0].title
                            : `${cart.length} bouquets`,
                    price: total
                }));

                const fullCart = JSON.parse(localStorage.getItem("cart") || "[]");
                const boughtIds = cart.map(item => String(item.id));

                const updatedCart = fullCart.filter(item => {
                    return !boughtIds.includes(String(item.id));
                });

                localStorage.setItem("cart", JSON.stringify(updatedCart));

                localStorage.removeItem("checkoutCart");
                localStorage.removeItem("selectedBouquet");

                window.location.href = "/success.html";
            } catch (error) {
                console.error(error);
                resultEl.textContent = error.message || "Order failed";
                orderBtn.disabled = false;
            }
        }

        function updateCartCount() {
            const countEl = document.getElementById("cartCount");
            if (!countEl) return;

            const cart = JSON.parse(localStorage.getItem("cart") || "[]");
            const count = cart.reduce((sum, item) => {
                return sum + Number(item.quantity || 1);
            }, 0);

            countEl.textContent = count;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const savedLang = localStorage.getItem("lang") || "en";

            await loadLanguage(savedLang);
            await autofillUserData();

            document.getElementById("orderBtn")
                .addEventListener("click", sendOrder);

            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const lang = btn.dataset.lang;
                    localStorage.setItem("lang", lang);
                    await loadLanguage(lang);
                    updateCartCount();
                });
            });
            updateCartCount();
        });
        </script>
    </body>
</html>
