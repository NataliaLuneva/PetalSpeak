        <div id="productModal" class="modal-overlay" style="display:none;">
            <div class="modal-card">

                <!-- Modal title -->

                <h3 id="productModalTitle" class="modal-title">Product</h3>

                <!-- Form fields for product information -->

                <div class="order-form">

                    <!-- Translation key for the product title -->

                    <input
                        id="productTitleKey"
                        class="order-input"
                        placeholder="title key"
                    />

                    <!-- Translation key for the product description -->

                    <input
                        id="productTextKey"
                        class="order-input"
                        placeholder="text key"
                    />

                    <!-- File input for uploading the product image -->

                    <input
                        id="productImage"
                        class="order-input"
                        type="file"
                        accept="image/*"
                    />

                    <!-- Input for product price -->

                    <input
                        id="productPrice"
                        class="order-input"
                        type="number"
                        placeholder="price"
                    />

                    <!-- Input for product category -->

                    <input
                        id="productCategory"
                        class="order-input"
                        placeholder="category"
                    />
                </div>

                <!-- Action buttons -->

                <div class="modal-actions">
                    <!-- Saves the new or edited product -->

                    <button id="saveProductBtn" class="btn">Save</button>

                    <!-- Closes the modal without saving -->
                    
                    <button
                        id="cancelProductBtn"
                        class="btn secondary"
                        type="button"
                    >
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
