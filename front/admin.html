<!doctype html>
<html lang="en">
<head>

    <!-- Character encoding and page title -->

    <meta charset="UTF-8">
    <title>Admin | PetalSpeak</title>
</head>
    <body>

        <!-- Main heading of the administration page -->

        <h1 data-i18n="admin_panel_title">Admin Panel</h1>

        <!-- Date filter used to limit displayed orders -->

        <div class="date-filter">
            <label for="dateFrom" data-i18n="from_label">От:</label>
            <input type="date" id="dateFrom">

            <label for="dateTo" data-i18n="to_label">До:</label>
            <input type="date" id="dateTo">

            <!-- Button for applying the selected date range -->

            <button id="applyDateFilter" type="button" data-i18n="show_btn">Показать</button>
        </div>

        <!-- Section displaying all registered users -->

        <h2 data-i18n="users_title">Users</h2>
        <div id="users"></div>

        <!-- Section displaying all customer orders -->

        <h2 data-i18n="orders_title">Orders</h2>
        <div id="orders"></div>

        <!-- Section displaying saved test results -->

        <h2 data-i18n="tests_title">Tests</h2>
        <div id="tests"></div>

        <script type="module">

            // Import API functions for administrative operations.

            import {
                getCurrentUser,
                getAdminUsers,
                getAdminOrders,
                getAdminTests,
                updateOrderStatus
            } from "/assets/js/api.js";

            // Retrieve the currently authenticated user.

            const user = getCurrentUser();

            // Restrict access to users with the administrator role.

            if (!user || user.role !== "admin") {
                document.body.innerHTML = `<h2>${t("access_denied")}</h2>`;
                throw new Error(t("access_denied"));
            }

            // Formats a date into a readable string.
            
            function formatDate(date) {
                if (!date) return "";
                return new Date(date).toLocaleString(currentLang);
            }

            // Loads and displays all users.

            async function loadUsers() {
                const users = await getAdminUsers();

                document.getElementById("users").innerHTML = users.map(user => `
                    <div style="margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div><strong>${user.name || t("no_name_label")}</strong></div>
                        <div>${user.email || ""}</div>
                        <div>${t("role_label")}: ${user.role || "user"}</div>
                    </div>
                `).join("");
            }

            // Loads and displays orders with optional date filtering.

            async function loadOrders() {
                const from = document.getElementById("dateFrom").value;
                const to = document.getElementById("dateTo").value;

                const orders = await getAdminOrders(from, to);

                document.getElementById("orders").innerHTML = orders.map(order => `
                    <div style="margin-bottom: 16px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div><strong>${order.customer_name || ""}</strong> (${order.email || ""})</div>
                        <div>${t("bouquet_label")}: ${order.bouquet_title || ""}</div>
                        <div>${t("price_label")}: €${order.price || 0}</div>
                        <div>${t("status_label")}: ${order.status || t("new_status")}</div>
                        <div>${t("date_label")}: ${formatDate(order.created_at)}</div>

                        <!-- Buttons for changing order status -->
                        <button onclick="window.changeStatus(${order.id}, 'processing')">
                            ${t("processing_status")}
                        </button>

                        <button onclick="window.changeStatus(${order.id}, 'done')">
                            ${t("done_status")}
                        </button>
                    </div>
                `).join("");
            }

            // Loads and displays all saved test results.

            async function loadTests() {
                const tests = await getAdminTests();

                document.getElementById("tests").innerHTML = tests.map(test => `
                    <div style="margin-bottom: 16px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div>${t("user_label")}: ${test.email || t("guest_label")}</div>
                        <div>${t("result_label")}: ${test.result || ""}</div>
                        <div>${t("bouquet_label")}: ${test.bouquet_title || ""}</div>
                        <div>${t("price_label")}: €${test.price || 0}</div>
                        <div>${t("date_label")}: ${formatDate(test.created_at)}</div>
                    </div>
                `).join("");
            }

            // Updates the status of an order and reloads the order list.

            window.changeStatus = async (id, status) => {
                await updateOrderStatus(id, status);
                await loadOrders();
            };

            // Apply the date filter when the button is clicked.

            document.getElementById("applyDateFilter").onclick = () => {

                loadOrders();
            };

            // Load all administrative data when the page opens.
            
            loadUsers();
            loadOrders();
            loadTests();
        </script>
    </body>
</html>
