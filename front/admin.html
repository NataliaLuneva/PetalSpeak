<!doctype html>
<html lang="en">
<head>

    <!-- Character encoding and page title -->

    <meta charset="UTF-8">
    <title>Admin | PetalSpeak</title>
</head>
    <body>

        <!-- Main heading of the administration page -->

        <h1>Admin Panel</h1>

        <!-- Date filter used to limit displayed orders -->

        <div class="date-filter">
            <label for="dateFrom">От:</label>
            <input type="date" id="dateFrom">

            <label for="dateTo">До:</label>
            <input type="date" id="dateTo">

            <!-- Button for applying the selected date range -->

            <button id="applyDateFilter" type="button">Показать</button>
        </div>

        <!-- Section displaying all registered users -->

        <h2>Users</h2>
        <div id="users"></div>

        <!-- Section displaying all customer orders -->

        <h2>Orders</h2>
        <div id="orders"></div>

        <!-- Section displaying saved test results -->

        <h2>Tests</h2>
        <div id="tests"></div>

        <script type="module">

            // Import API functions for administrative operations.

            import {
                getCurrentUser,
                getAdminUsers,
                getAdminOrders,
                getAdminTests,
                updateOrderStatus
            } from "/assets/js/api.js";

            // Retrieve the currently authenticated user.

            const user = getCurrentUser();

            // Restrict access to users with the administrator role.

            if (!user || user.role !== "admin") {
                document.body.innerHTML = "<h2>Access denied</h2>";
                throw new Error("Access denied");
            }

            // Formats a date into a readable string.
            
            function formatDate(date) {
                if (!date) return "";
                return new Date(date).toLocaleString("ru-RU");
            }

            // Loads and displays all users.

            async function loadUsers() {
                const users = await getAdminUsers();

                document.getElementById("users").innerHTML = users.map(user => `
                    <div style="margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div><strong>${user.name || "Без имени"}</strong></div>
                        <div>${user.email || ""}</div>
                        <div>Role: ${user.role || "user"}</div>
                    </div>
                `).join("");
            }

            // Loads and displays orders with optional date filtering.

            async function loadOrders() {
                const from = document.getElementById("dateFrom").value;
                const to = document.getElementById("dateTo").value;

                const orders = await getAdminOrders(from, to);

                document.getElementById("orders").innerHTML = orders.map(order => `
                    <div style="margin-bottom: 16px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div><strong>${order.customer_name || ""}</strong> (${order.email || ""})</div>
                        <div>Bouquet: ${order.bouquet_title || ""}</div>
                        <div>Price: €${order.price || 0}</div>
                        <div>Status: ${order.status || "new"}</div>
                        <div>Date: ${formatDate(order.created_at)}</div>

                        <!-- Buttons for changing order status -->
                        <button onclick="window.changeStatus(${order.id}, 'processing')">
                            processing
                        </button>

                        <button onclick="window.changeStatus(${order.id}, 'done')">
                            done
                        </button>
                    </div>
                `).join("");
            }

            // Loads and displays all saved test results.

            async function loadTests() {
                const tests = await getAdminTests();

                document.getElementById("tests").innerHTML = tests.map(test => `
                    <div style="margin-bottom: 16px; border-bottom: 1px solid #ccc; padding-bottom: 8px;">
                        <div>User: ${test.email || "guest"}</div>
                        <div>Result: ${test.result || ""}</div>
                        <div>Bouquet: ${test.bouquet_title || ""}</div>
                        <div>Price: €${test.price || 0}</div>
                        <div>Date: ${formatDate(test.created_at)}</div>
                    </div>
                `).join("");
            }

            // Updates the status of an order and reloads the order list.

            window.changeStatus = async (id, status) => {
                await updateOrderStatus(id, status);
                await loadOrders();
            };

            // Apply the date filter when the button is clicked.

            document.getElementById("applyDateFilter").onclick = () => {

                loadOrders();
            };

            // Load all administrative data when the page opens.
            
            loadUsers();
            loadOrders();
            loadTests();
        </script>
    </body>
</html>
